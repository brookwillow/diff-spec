model: hfl/chinese-macbert-base
train_file: data/diffusion/train.jsonl
output_dir: outputs/diffusion_drafter

max_length: 512
max_target_tokens: 128
validation_ratio: 0.02
seed: 42

num_train_epochs: 5
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 0.00005
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 20
eval_steps: 200
save_steps: 200
save_total_limit: 2
