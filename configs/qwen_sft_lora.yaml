# ms-swift LoRA SFT config for the automotive tool-calling verifier baseline.
#
# Run with:
#   conda run -n qwen-omni swift sft configs/qwen_sft_lora.yaml
#
# Override `model` with a local model path on offline machines, for example:
#   model: /path/to/Qwen2.5-1.5B-Instruct

model: Qwen/Qwen2.5-1.5B-Instruct
dataset:
  - data/sft/qwen_train.jsonl
system: data/system-prompt.txt
output_dir: outputs/qwen2_5_1_5b_tool_lora

tuner_type: lora
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05

torch_dtype: float16
attn_impl: sdpa
max_length: 4096
truncation_strategy: delete

num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
warmup_ratio: 0.03
lr_scheduler_type: cosine

split_dataset_ratio: 0.02
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 2
logging_steps: 10

gradient_checkpointing: true
dataset_num_proc: 1
load_from_cache_file: true
report_to:
  - none
